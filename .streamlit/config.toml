# Visual theme for the Streamlit UI (app.py)
[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F6FA"
textColor = "#111827"
borderColor = "#E5E7EB"
linkColor = "#4F46E5"
baseRadius = "0.6rem"
buttonRadius = "0.5rem"
headingFontWeights = [700, 650]
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#F8F9FC"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
